name: Deploy ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-alkok-fe
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            APP_NAME=web
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://alkok.dobbymin.cloud' }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://alkok.dobbymin.cloud' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lower }}-web:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lower }}-web:latest

      - name: Build and push ARM64 admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            APP_NAME=admin
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://alkok.dobbymin.cloud' }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://alkok.dobbymin.cloud' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lower }}-admin:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_lower }}-admin:latest

      - name: Deploy web & admin to Raspberry Pi with 30s healthcheck & rollback
        env:
          RPI_HOST: ${{ secrets.RPI_HOST }}
          RPI_USER: ${{ secrets.RPI_USER }}
          RPI_SSH_KEY: ${{ secrets.RPI_SSH_KEY }}
          RPI_PORT: ${{ secrets.RPI_PORT || '22' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEW_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          if [ -z "$RPI_HOST" ] || [ -z "$RPI_USER" ] || [ -z "$RPI_SSH_KEY" ]; then
            echo "RPI_HOST / RPI_USER / RPI_SSH_KEY secrets are not configured yet. Skipping SSH deploy."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$RPI_SSH_KEY" > ~/.ssh/id_rpi
          chmod 600 ~/.ssh/id_rpi
          ssh-keyscan -p "$RPI_PORT" -H "$RPI_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/id_rpi -p "$RPI_PORT" -o StrictHostKeyChecking=accept-new "${RPI_USER}@${RPI_HOST}" "bash -s" <<EOF
          set -euo pipefail
          DEPLOY_DIR="/home/dobbymin/project/alkok"
          cd "\$DEPLOY_DIR"

          deploy_service() {
            local SERVICE="\$1"
            local ENV_VAR="\$2"
            local HEALTH_URL="\$3"
            local LAST_GOOD_FILE="\${DEPLOY_DIR}/.last_good_\${SERVICE}"

            local PREV_TAG
            PREV_TAG=\$(docker inspect -f '{{.Config.Image}}' "\$SERVICE" 2>/dev/null | awk -F: '{print \$NF}' || true)
            if [ -n "\$PREV_TAG" ]; then
              echo "\$PREV_TAG" > "\$LAST_GOOD_FILE"
            fi

            export "\${ENV_VAR}=${NEW_TAG}"
            docker compose -f docker-compose.prod.yml pull "\$SERVICE"
            docker compose -f docker-compose.prod.yml up -d --no-deps "\$SERVICE"

            local HEALTHY=0
            for i in \$(seq 1 15); do
              if curl -fsS "\$HEALTH_URL" >/dev/null 2>&1; then
                HEALTHY=1
                break
              fi
              sleep 2
            done

            if [ "\$HEALTHY" -ne 1 ]; then
              echo "Healthcheck failed for \${SERVICE} (${NEW_TAG}); initiating rollback..." >&2
              local ROLLBACK_TAG="none"
              if [ -f "\$LAST_GOOD_FILE" ]; then
                ROLLBACK_TAG=\$(cat "\$LAST_GOOD_FILE")
                export "\${ENV_VAR}=\${ROLLBACK_TAG}"
                docker compose -f docker-compose.prod.yml pull "\$SERVICE" || true
                docker compose -f docker-compose.prod.yml up -d --no-deps "\$SERVICE" || true
              fi
              if [ -n "${DISCORD_WEBHOOK_URL}" ]; then
                curl -fsS -H "Content-Type: application/json" \
                  -d "{\"content\": \"[\${SERVICE}] 배포 실패(${NEW_TAG})로 인해 직전 버전(\${ROLLBACK_TAG})으로 자동 롤백했습니다.\"}" \
                  "${DISCORD_WEBHOOK_URL}" >/dev/null 2>&1 || true
              fi
              exit 1
            fi
          }

          deploy_service "alkok-fe-web" "FE_WEB_IMAGE_TAG" "http://127.0.0.1:18101/"
          deploy_service "alkok-fe-admin" "FE_ADMIN_IMAGE_TAG" "http://127.0.0.1:18103/admin"

          if [ -n "${DISCORD_WEBHOOK_URL}" ]; then
            curl -fsS -H "Content-Type: application/json" \
              -d "{\"content\": \"[alkok-fe] web + admin 배포 완료 (${NEW_TAG})\"}" \
              "${DISCORD_WEBHOOK_URL}" >/dev/null 2>&1 || true
          fi
          EOF
