name: Deploy ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-alkok-fe
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://alkok.dobbymin.cloud' }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://alkok.dobbymin.cloud' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_lower }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_lower }}:latest

      - name: Deploy to Raspberry Pi with 30s healthcheck & auto-rollback
        if: ${{ secrets.RPI_HOST != '' && secrets.RPI_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key: ${{ secrets.RPI_SSH_KEY }}
          port: ${{ secrets.RPI_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_DIR="/home/dobbymin/project/alkok"
            LAST_GOOD_FILE="${DEPLOY_DIR}/.last_good_alkok-fe"
            NEW_TAG="${{ steps.meta.outputs.sha_tag }}"
            DISCORD_WEBHOOK="${{ secrets.DISCORD_WEBHOOK_URL }}"

            cd "$DEPLOY_DIR"

            PREV_TAG=$(docker inspect -f '{{.Config.Image}}' alkok-fe 2>/dev/null | awk -F: '{print $NF}' || true)
            if [ -n "$PREV_TAG" ]; then
              echo "$PREV_TAG" > "$LAST_GOOD_FILE"
            fi

            export FE_IMAGE_TAG="$NEW_TAG"
            docker compose pull alkok-fe
            docker compose up -d --no-deps alkok-fe

            HEALTHY=0
            for i in $(seq 1 15); do
              if curl -fsS "http://127.0.0.1:18101/" >/dev/null 2>&1; then
                HEALTHY=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Healthcheck failed for $NEW_TAG; initiating rollback..."
              if [ -f "$LAST_GOOD_FILE" ]; then
                ROLLBACK_TAG=$(cat "$LAST_GOOD_FILE")
                export FE_IMAGE_TAG="$ROLLBACK_TAG"
                docker compose pull alkok-fe || true
                docker compose up -d --no-deps alkok-fe || true
              fi
              if [ -n "$DISCORD_WEBHOOK" ]; then
                curl -fsS -H "Content-Type: application/json" \
                  -d "{\"content\": \"[alkok-fe] 배포 실패(${NEW_TAG})로 인해 직전 버전(${ROLLBACK_TAG:-none})으로 자동 롤백했습니다.\"}" \
                  "$DISCORD_WEBHOOK" || true
              fi
              exit 1
            fi

            echo "$NEW_TAG" > "$LAST_GOOD_FILE"
            echo "Deployed alkok-fe:$NEW_TAG successfully."
